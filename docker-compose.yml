services:
  mysql:
    image: mysql:8.4
    container_name: lending-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: lending
      MYSQL_USER: lending
      MYSQL_PASSWORD: lending_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u lending -plending_dev_password || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lending-redis
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnamilegacy/kafka:3.8.1
    container_name: lending-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 15s
      timeout: 10s
      retries: 10

  auth-service:
    build: ./services/auth-service
    ports: [ "8081:8081" ]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/authdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: lending
      DB_PASSWORD: lending_dev_password
      JWT_SECRET: change-me-in-development-only-change-me-in-production
    depends_on:
      mysql:
        condition: service_healthy

  customer-service:
    build: ./services/customer-service
    ports: [ "8082:8082" ]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/customerdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: lending
      DB_PASSWORD: lending_dev_password
      JWT_SECRET: change-me-in-development-only-change-me-in-production
    depends_on:
      mysql:
        condition: service_healthy

  loan-service:
    build: ./services/loan-service
    ports: [ "8083:8083" ]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/loandb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: lending
      DB_PASSWORD: lending_dev_password
      JWT_SECRET: change-me-in-development-only-change-me-in-production
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy


  payment-service:
    build: ./services/payment-service
    ports: [ "8084:8084" ]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/paymentdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: lending
      DB_PASSWORD: lending_dev_password
      JWT_SECRET: change-me-in-development-only-change-me-in-production
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    ports: [ "8085:8085" ]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/notificationdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: lending
      DB_PASSWORD: lending_dev_password
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  api-gateway:
    build: ./services/api-gateway
    ports: [ "8080:8080" ]
    environment:
      AUTH_URL: http://auth-service:8081
      CUSTOMER_URL: http://customer-service:8082
      LOAN_URL: http://loan-service:8083
      PAYMENT_URL: http://payment-service:8084
      NOTIFICATION_URL: http://notification-service:8085
    depends_on:
      - auth-service
      - customer-service
      - loan-service
      - payment-service
      - notification-service

  frontend:
    build: ./frontend
    container_name: lending-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  mysql_data:
  redis_data:
  kafka_data:
